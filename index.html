<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1ea">
  <title>Petit compteur</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f4f1ea; color: #24231f; }
    main { width: min(90vw, 360px); padding: 2rem; text-align: center; background: white; border-radius: 24px; box-shadow: 0 12px 40px #24231f16; }
    h1 { margin: 0 0 .4rem; font-size: 1.5rem; }
    p { color: #68665f; }
    output { display: block; margin: 1.5rem; font-size: 4rem; font-weight: 750; font-variant-numeric: tabular-nums; }
    button { border: 0; border-radius: 12px; padding: .8rem 1.2rem; background: #345b45; color: white; font: inherit; font-weight: 650; cursor: pointer; }
    button:hover { background: #284936; }
    button:focus-visible { outline: 3px solid #d5a84c; outline-offset: 3px; }
    .reset { margin-left: .5rem; background: #e9e7e1; color: #24231f; }
    .reset:hover { background: #dddad1; }
  </style>
</head>
<body>
  <main>
    <h1>Petit compteur</h1>
    <p>Un mini-projet tout simple : comptez vos clics.</p>
    <output id="count" aria-live="polite">0</output>
    <button id="add" type="button">+ Ajouter</button>
    <button id="reset" class="reset" type="button">Réinitialiser</button>
  </main>
  <script>
    let count = 0;
    const display = document.querySelector('#count');
    document.querySelector('#add').addEventListener('click', () => {
      display.textContent = String(++count);
    });
    document.querySelector('#reset').addEventListener('click', () => {
      count = 0;
      display.textContent = '0';
    });
  </script>
</body>
</html>
